[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qcr-repro"
version = "0.1.0"
description = "Reproduction and extension of 'Optimization driven quantum circuit reduction' (Rosenhahn, Osborne, Hirche, New J. Phys. 27 (2025) 104509)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
baselines = [
    "qiskit>=1.2",
    "bqskit>=1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
