[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qcr-repro"
version = "0.1.0"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
baselines = [
    "qiskit>=1.2",
    "bqskit>=1.1",
]

# Optional: only needed by the V3-style RF-gated lookup (--rf-gate in
# scripts/benchmark_comparison.py).  Without it the gate degrades to an
# exact memo cache of already-tried blocks.
ml = [
    "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
